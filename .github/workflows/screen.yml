name: volume-price-divergence-screen

on:
  schedule:
    # 21:20 UTC = 06:20 KST (미국 장 마감 후, Claude 07:00 분석 전)
    - cron: "20 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vpd-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # 선택: KRX 데이터포털 계정을 Secrets에 넣으면 실제 KOSPI200/KOSDAQ150 구성종목 사용
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python screener.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "screen: $(TZ=Asia/Seoul date +%F)"
            git pull --rebase
            git push
          fi
